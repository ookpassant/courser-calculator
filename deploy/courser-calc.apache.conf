# Apache config for serving the breeding calculator at ook.monster/courser-calc
#
# Drop these directives INSIDE your existing ook.monster <VirtualHost> block
# (the HTTPS one on :443, and the :80 one too if it isn't just redirecting to
# HTTPS). Then reload Apache:  sudo systemctl reload apache2   (or httpd)
#
# Assumes the git clone lives at /var/www/courser-calc. Change both paths
# below if you put it somewhere else.

# Map the URL path to the clone directory.
Alias /courser-calc /var/www/courser-calc

# Add the trailing slash so relative asset paths (breeding-calculator.js)
# resolve correctly.
RedirectMatch ^/courser-calc$ /courser-calc/

<Directory /var/www/courser-calc>
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.html
</Directory>

# Always revalidate the app itself.
#
# Without this the site sends no Cache-Control at all, so browsers fall back to
# heuristic caching and each file ages independently. That let a phone pick up a
# fresh index.html while still running a cached app.js, and a new tool's nav
# link opened the Foal Generator instead: the markup knew about the tab, the
# stale script didn't. Mobile browsers hold onto assets hardest, which is why it
# showed up there first.
#
# "no-cache" does not mean "don't cache" — it means "check with me before
# reusing this". With ETags already on, that check is a 304 with no body, so
# this costs a round trip and nothing else, and the three files can never again
# be served as a mismatched set.
<FilesMatch "\.(html|js|webmanifest)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# Requires mod_headers:  sudo a2enmod headers && sudo systemctl reload apache2

# Never expose the git metadata over the web.
<DirectoryMatch "^/var/www/courser-calc/\.git">
    Require all denied
</DirectoryMatch>
